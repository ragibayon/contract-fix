[project]
name = "contractfix"
version = "1.0.0"
description = "Evidence-grounded executable contracts for repository repair"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<1",
    "jinja2>=3.1.6,<4",
    "langchain>=1.4.1",
    "langchain-openai>=1.6.2",
    "pydantic>=2.10,<3",
    "python-dotenv>=1.2.3",
    "rich>=14.0",
]

[project.scripts]
contractfix = "contractfix.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
contractfix = [
    "agents/prompts/schema_retry.j2",
    "llm/reasoning_capabilities.json",
    "workflow/languages/python/prompts/*.j2",
    "workflow/languages/python/prompts/*.json",
    "workflow/languages/python/prompts/*.jsonl",
    "workflow/languages/python/prompts/skills/*.md",
]
